<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Class Graph</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      background-color: #1e1e1e;
      font-family: Arial, sans-serif;
    }

    #mynetwork {
      width: 100%;
      height: 100vh;
      border: 1px solid #3d3d3d;
    }

    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #252526;
      padding: 15px;
      border-radius: 5px;
      z-index: 1000;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }


    input[type="text"],
    input[type="file"],
    select,
    button {
      padding: 8px;
      margin: 5px;
      background: #333;
      border: 1px solid #3d3d3d;
      color: white;
      border-radius: 4px;
      font-size: 14px;
    }

    select {
      appearance: none;
      background-color: #333;
      color: white;
    }

  .progress-container {
    width: calc(100% - 10px); /* Account for parent padding */
    margin: 10px 5px 0;
    display: none; /* Start hidden */
  }

  .progress-bar-background {
    width: 100%;
    height: 20px;
    background: #333;
    border-radius: 4px;
    border: 1px solid #3d3d3d;
    overflow: hidden;
  }

  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: #0e639c;
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .progress-text {
    color: #c8c8c8;
    margin-top: 4px;
    font-size: 12px;
    text-align: center;
  }

  .sidebar {
    display: none;
  position: absolute;
  top: 50%;
  left: 10px;
  width: 220px;
  background: #252526;
  padding: 15px;
  border-radius: 5px;
  z-index: 1000;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  overflow-y: auto;
  max-height: calc(100vh - 20px);
}

.sidebar-section {
  margin-bottom: 15px;
}

.sidebar-header {
  color: #c8c8c8;
  cursor: pointer;
  font-weight: bold;
  margin-bottom: 5px;
  border-radius: 5px;
  padding: 5px;
}

.sidebar-content {
  list-style: none;
  padding-left: 10px;
  display: none;
  color: #f1f1f1;
}

.sidebar-content li {
  margin: 4px 0;
  font-size: 13px;
}
.sidebar-header::before {
  content: "\f054"; /* FontAwesome chevron-right */
  font-family: "FontAwesome";
  margin-right: 8px;
  transition: transform 0.2s;
}

.sidebar-content-visible::before {
  content: "\f078"; /* FontAwesome chevron-down */
}

.sidebar-header:hover {
  background-color: #2a2d2e;
}

.sidebar-content-visible {
  background-color: #2a2d2e;
}

</style>
</head>
<body>
  <div class="controls">
    <input type="text" id="directoryPath" placeholder="Enter directory path">
    <button onclick="listProjects()">List Projects</button>
    <select id="projectSelect" style="display: none;">
      <option value="">Select a project</option>
    </select>
    <button onclick="analyzeSelectedProject()" style="display: none;">Visualize</button>
    
    <div id="progressContainer" class="progress-container">
      <div class="progress-bar-background">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div id="progressText" class="progress-text"></div>
    </div>
  </div>
  <div id="mynetwork"></div>

  <div class="sidebar">
    <div class="sidebar-section" id="referencedTypesSection">
      <div class="sidebar-header" onclick="toggleSidebarContent('referencedTypesContent')">
        Referenced Types
      </div>
      <ul class="sidebar-content" id="referencedTypesContent"></ul>
    </div>
  
    <div class="sidebar-section" id="methodsSection">
      <div class="sidebar-header" onclick="toggleSidebarContent('methodsContent')">
        Methods
      </div>
      <ul class="sidebar-content" id="methodsContent"></ul>
    </div>
  </div>
</body>
</html>
<script>
  const interfaceNodes = new Set();

  async function listProjects() {
    const path = document.getElementById('directoryPath').value;
    const response = await fetch('/api/list-projects', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: path
    });

    if (!response.ok) {
      alert('Error: ' + await response.text());
      return;
    }

    const projects = await response.json();
    const select = document.getElementById('projectSelect');
    select.innerHTML = '<option value="">Select a project</option>';
    projects.forEach(projectPath => {
      const option = document.createElement('option');
      option.value = projectPath;
      option.textContent = projectPath.split(/[\\/]/).pop(); // Show filename only
      select.appendChild(option);
    });
    select.style.display = 'inline';
    document.querySelector('button[onclick="analyzeSelectedProject()"]').style.display = 'inline';
  }

  let eventSource;

  function startProgressUpdates() {
    document.getElementById('progressContainer').style.display = 'block';
    eventSource = new EventSource('/api/progress');

    eventSource.onmessage = function (event) {
      const { progress, message } = JSON.parse(event.data);
      const bar = document.getElementById('progressBar');
      const text = document.getElementById('progressText');
      bar.style.width = `${progress}%`;
      text.textContent = message;

      if (progress >= 100) {
        setTimeout(() => {
          eventSource.close();
          document.getElementById('progressContainer').style.display = 'none';
          bar.style.width = '0%';
          text.textContent = '';
        }, 1000);
      }
    };

    eventSource.onerror = function () {
      eventSource.close();
    };
  }

  async function analyzeSelectedProject() {
    const select = document.getElementById('projectSelect');
    const selectedProject = select.value;
    if (!selectedProject) {
      alert('Please select a project');
      return;
    }

    startProgressUpdates(); // Start SSE connection

    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: selectedProject
    });

    if (!response.ok) {
      alert('Error: ' + await response.text());
      return;
    }

    const data = await response.json();
    visualizeData(data);
  }

  function visualizeData(data) {
    const nodeMap = {};
    const nodes = [];
    const edges = [];

    const colors = {
      class: '#4EC9B0',
      interface: '#C586C0',
      baseType: '#569CD6',
      reference: '#DCDCAA'
    };

    data.forEach(cls => {
      addNode(cls.name, colors.class);

      if (cls.baseType) {
        addNode(cls.baseType, colors.baseType);
        addEdge(cls.name, cls.baseType, 'inherits');
      }

      cls.interfaces.forEach(iface => {
        addNode(iface, colors.interface);
        interfaceNodes.add(iface);
        addEdge(cls.name, iface, 'implements');
      });

      // All references and methods can be found in sidebar
      //cls.referencedTypes.forEach(ref => {
      //  addNode(ref, colors.reference);
      //  addEdge(cls.name, ref, 'uses');
      //});
    });

    function addNode(id, color) {
      if (nodeMap[id]) return;
      const node = {
        id,
        label: id,
        shape: 'box',
        shadow: true,
        color: {
          background: color,
          border: '#3f3f3f',
          hover: { background: color, border: '#3f3f3f' }
        },
        font: { color: '#ffffff' },
        borderWidth: 2
      };
      nodeMap[id] = node;
      nodes.push(node);
    }

    function addEdge(from, to, label) {
      edges.push({
        from,
        to,
        label,
        arrows: 'to',
        color: {
          color: '#888',
          hover: '#aaa',
          opacity: 0.7
        },
        font: { color: '#fff', size: 12 },
        smooth: { type: 'cubicBezier', forceDirection: 'horizontal' }
      });
    }

    const container = document.getElementById('mynetwork');
    const dataSet = {
      nodes: new vis.DataSet(nodes),
      edges: new vis.DataSet(edges)
    };

    const options = {
      layout: {
        hierarchical: false
      },
      physics: {
        enabled: true,
        stabilization: {
          iterations: 100
        },
        barnesHut: {
          gravitationalConstant: -2500,
          springLength: 200,
          springConstant: 0.05,
          damping: 0.3
        }
      },
      interaction: {
        dragNodes: true,
        dragView: true,
        hover: true
      }
    };

    const network = new vis.Network(container, dataSet, options);

    // Disable physics after layout settles
    network.once('stabilizationIterationsDone', () => {
      network.setOptions({ physics: false });
    });

    // Enable group dragging behavior
    enableGroupDrag(network);

    // Sidebar related bindings
    sidebarBindings(network, data);
  };

  function enableGroupDrag(network) {
    let draggingBase = null;
    let initialPositions = {};
    let baseStartPos = null;

    function getConnectedNodesRecursive(nodeId, visited = new Set()) {
      if (visited.has(nodeId)) return [];
      visited.add(nodeId);

      const children = network.getConnectedNodes(nodeId, 'from');
      let all = [...children];

      for (const child of children) {
        all = all.concat(getConnectedNodesRecursive(child, visited));
      }
      return all;
    }

    network.on('dragStart', function (params) {
      if (params.nodes.length === 1) {
        draggingBase = params.nodes[0];

        if (interfaceNodes.has(draggingBase)) {
          // It's an interface — skip group dragging entirely
          draggingBase = null;
          return;
        }

        baseStartPos = network.getPositions([draggingBase])[draggingBase];
        const connected = getConnectedNodesRecursive(draggingBase);
        const all = [draggingBase, ...connected];

        const positions = network.getPositions(all);
        initialPositions = {};
        for (let id of all) {
          initialPositions[id] = positions[id];
        }
      }
    });

    network.on('dragging', function () {
      if (!draggingBase) return;
      const currentPos = network.getPositions([draggingBase])[draggingBase];
      const dx = currentPos.x - baseStartPos.x;
      const dy = currentPos.y - baseStartPos.y;

      for (let [id, pos] of Object.entries(initialPositions)) {
        if (id !== draggingBase) {
          network.moveNode(id, pos.x + dx, pos.y + dy);
        }
      }
    });

    network.on('dragEnd', function () {
      draggingBase = null;
      initialPositions = {};
      baseStartPos = null;
    });
  }

  function sidebarBindings(network, data){
     network.on('selectNode', function (params) {
      document.querySelector('.sidebar').style.display = 'block'; // Show sidebar
      const selectedNodeId = params.nodes[0];
      const referencedTypes = (data.find(d => d.name === selectedNodeId)?.referencedTypes || []);
      const methods = (data.find(d => d.name === selectedNodeId)?.methods || []).map(m => m.name);

      // Fill referenced types
      const refList = document.getElementById('referencedTypesContent');
      refList.innerHTML = '';
      referencedTypes.forEach(type => {
        const li = document.createElement('li');
        li.textContent = type;
        refList.appendChild(li);
      });

      // Fill methods
      const methodList = document.getElementById('methodsContent');
      methodList.innerHTML = '';
      methods.forEach(method => {
        const li = document.createElement('li');
        li.textContent = method;
        methodList.appendChild(li);
      });
    });

    network.on('deselectNode', function () {
      document.querySelector('.sidebar').style.display = 'none'; // Hide sidebar
    });
  }

  function toggleSidebarContent(id) {
    const content = document.getElementById(id);
    const header = content.previousElementSibling;
    const isVisible = content.style.display === 'block';
    
    content.style.display = isVisible ? 'none' : 'block';
    header.classList.toggle('sidebar-content-visible', !isVisible);
  }
</script>
